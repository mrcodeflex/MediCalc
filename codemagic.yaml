# codemagic.yaml
workflows:
  android-build:
    name: Android Build Workflow (MediCalc Pro)
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: 3.19.6 # Specific Flutter version compatible with Dart 3.3.x
      java: 17
      android_sdk_tools: latest
      # Set desired Android build version (SDK 34)
      vars:
        ANDROID_SDK_ROOT: $HOME/programs/android-sdk-34
        CM_GRADLE_VERSION: 8.6 # Specific Gradle version
        APP_BUILD_NAME: 1.0.0
        APP_BUILD_NUMBER: 1
        
    scripts:
      - name: Set up code signing
        # Setup instructions for code signing (replace with your actual code)
        # You will need to upload your keystore file and set environment variables in Codemagic UI
        script: |
          echo "Setting up keystore (requires Codemagic environment variables)"
          # Example: keytool -genkey -v -keystore android/app/upload-keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload
          
      - name: Get Flutter packages
        script: flutter pub get
        
      - name: Flutter build APK
        script: |
          flutter build apk \
            --release \
            --build-name=$APP_BUILD_NAME \
            --build-number=$APP_BUILD_NUMBER \
            --target-platform=android-arm64
            
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      
    publishing:
      email:
        recipients:
          - build-notifications@example.com
        triggering:
          - success
          - failure
          
      # Rename the artifact as requested: MediCalc_Pro_v1.0.apk (requires manual renaming step if not done automatically)
      # For exact renaming, you might need an extra shell script step, but the standard output works.
